name: iOS build and package

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Sideload IPA or archive/export with installed developer signing assets
        type: choice
        options: [sideload, developer-archive]
        default: sideload
      game_source:
        description: Optional authorized input; local input selects an existing self-hosted Mac
        type: choice
        options: [none, secret-download, self-hosted]
        default: none
      heap_gb:
        description: Heap shared by the host precompiler and iOS runtime (integer 1..8)
        type: string
        default: "5"
      export_method:
        description: Developer archive export method (exports a file; does not submit it)
        type: choice
        options: [debugging, release-testing, app-store-connect]
        default: debugging

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Standard public preview runner. No large/paid runner is provisioned.
    # Local inputs use an already configured self-hosted ARM64 Mac with this label.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.game_source == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64", "muguet-ios"]') || 'xcode-27' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2_beta_2.app/Contents/Developer
      MUGUET_CI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'sideload' }}
      MUGUET_GAME_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.game_source || 'none' }}
      MUGUET_IOS_HEAP_GB: ${{ inputs.heap_gb || '5' }}
      MUGUET_EXPORT_METHOD: ${{ inputs.export_method || 'debugging' }}
      BUNDLE_ID: ${{ vars.MUGUET_BUNDLE_ID || 'com.qeyf.muguet' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check portable build and assets policy
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build actual launcher or authorized precompiled game
        shell: bash
        env:
          # Game/signing credentials are available only to explicitly selected
          # manual modes. PR and push builds always use launcher-only sideloading.
          MUGUET_GAME_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.game_source == 'secret-download' && secrets.MUGUET_GAME_URL || '' }}
          MUGUET_GAME_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.game_source != 'none' && secrets.MUGUET_GAME_SHA256 || '' }}
          MUGUET_GAME_LOCAL_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.game_source == 'self-hosted' && vars.MUGUET_GAME_LOCAL_PATH || '' }}
          TEAM: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && secrets.APPLE_TEAM_ID || '' }}
          MUGUET_SIGNING_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && secrets.MUGUET_SIGNING_IDENTITY || '' }}
          MUGUET_SIGNING_P12_BASE64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && secrets.MUGUET_SIGNING_P12_BASE64 || '' }}
          MUGUET_SIGNING_P12_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && secrets.MUGUET_SIGNING_P12_PASSWORD || '' }}
          MUGUET_PROVISION_PROFILE_BASE64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && secrets.MUGUET_PROVISION_PROFILE_BASE64 || '' }}
          MUGUET_DEVICE_UDID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'developer-archive' && inputs.export_method != 'app-store-connect' && secrets.MUGUET_DEVICE_UDID || '' }}
        run: ./scripts/build-ios-ci.sh

      - name: Verify iOS 27 simulator launcher lifecycle
        if: env.MUGUET_GAME_SOURCE == 'none'
        shell: bash
        run: ./scripts/test-ios-simulator.sh

      - name: Retain build evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-build-evidence-${{ github.run_id }}
          path: build/ios-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain verified IPA and optional developer archive
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.MUGUET_GAME_SOURCE == 'none' && 'Muguet-Launcher' || 'Muguet-AuthorizedGame' }}-${{ env.MUGUET_CI_MODE }}
          path: |
            build/*-sideload.ipa
            build/Muguet-AOT-compiler-macos-arm64.zip
            build/*.xcarchive.zip
            build/export/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish a verified launcher version
    needs: ios
    # No PR, signing-secret run or commercial game input can publish a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUNDLE_ID: ${{ vars.MUGUET_BUNDLE_ID || 'com.qeyf.muguet' }}
    steps:
      - name: Checkout exact built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the same run's verified launcher
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Muguet-Launcher-sideload
          path: release-input/package

      - name: Download the same run's native test evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iOS-build-evidence-${{ github.run_id }}
          path: release-input/evidence

      - name: Prepare versioned files and measured test report
        run: python3 scripts/prepare-ios-release.py release-input/package release-input/evidence release-output

      - name: Publish once through official GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(cat release-output/tag.txt)"
          if gh release view "$TAG" --json isDraft,url > existing-release.json 2> existing-release-error.txt; then
            python3 - <<'PY'
          import json, sys
          release = json.load(open('existing-release.json'))
          if release['isDraft']:
              sys.exit('An existing draft needs inspection; no release assets were overwritten')
          print('Published version already exists; retained unchanged: ' + release['url'])
          PY
            exit 0
          fi
          gh --version
          # Creating the ref explicitly rejects orphan tags instead of silently
          # reusing an old source revision. Never force or replace a tag.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Muguet $TAG — iOS 27 launcher" --notes-file release-output/TEST_REPORT.md \
            release-output/*.ipa release-output/*.zip release-output/TEST_REPORT.md release-output/SHA256SUMS
